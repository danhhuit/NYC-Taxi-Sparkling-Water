<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tổng quan đồ án NYC Yellow Taxi</title>
  <desc id="desc">Infographic 16:9 tóm tắt pipeline, cấu hình, dữ liệu, mô hình, demo và kết quả triển khai.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #0a0a0a; }
      .muted { fill: #666666; }
      .soft { fill: #f4f4f4; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .hairline { stroke: #d2d2d2; stroke-width: 1.5; }
      .title { font: 800 51px "Segoe UI", Arial, sans-serif; letter-spacing: -1px; }
      .subtitle { font: 400 23px "Segoe UI", Arial, sans-serif; }
      .eyebrow { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 2.2px; }
      .stage { font: 700 17px "Segoe UI", Arial, sans-serif; }
      .stageSmall { font: 600 13px "Segoe UI", Arial, sans-serif; }
      .panelTitle { font: 800 23px "Segoe UI", Arial, sans-serif; letter-spacing: .3px; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; }
      .value { font: 800 23px "Segoe UI", Arial, sans-serif; }
      .body { font: 400 16px "Segoe UI", Arial, sans-serif; }
      .bodyStrong { font: 700 16px "Segoe UI", Arial, sans-serif; }
      .chip { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: .2px; }
      .result { font: 800 17px "Segoe UI", Arial, sans-serif; }
      .resultSmall { font: 600 13px "Segoe UI", Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text x="70" y="76" class="eyebrow muted">BIG DATA • MACHINE LEARNING • DEPLOYMENT</text>
  <text x="70" y="137" class="title ink">TỔNG QUAN ĐỒ ÁN NYC YELLOW TAXI</text>
  <text x="70" y="176" class="subtitle muted">Phân tích dữ liệu lớn và dự đoán thời gian chuyến đi tại New York</text>
  <rect x="1311" y="61" width="219" height="104" rx="14" class="ink"/>
  <text x="1337" y="91" class="eyebrow" fill="#ffffff">KẾT QUẢ CUỐI</text>
  <text x="1337" y="126" class="value" fill="#ffffff">DRF • R² 0,7488</text>
  <text x="1337" y="151" class="body" fill="#d8d8d8">RMSE 7,4383 phút</text>

  <!-- Pipeline -->
  <text x="70" y="224" class="eyebrow ink">01 — PIPELINE XỬ LÝ VÀ TRIỂN KHAI</text>
  <line x1="120" y1="303" x2="1481" y2="303" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(70,247)">
    <circle cx="50" cy="56" r="47" class="ink"/>
    <text x="50" y="50" text-anchor="middle" class="stage" fill="#ffffff">NYC TLC</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall" fill="#ffffff">12 THÁNG</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Parquet 2025</text>
  </g>
  <g transform="translate(265,247)">
    <circle cx="50" cy="56" r="47" class="soft" stroke="#111" stroke-width="2"/>
    <text x="50" y="50" text-anchor="middle" class="stage ink">SPARK</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall ink">ETL</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Clean + feature</text>
  </g>
  <g transform="translate(460,247)">
    <circle cx="50" cy="56" r="47" class="ink"/>
    <text x="50" y="50" text-anchor="middle" class="stageSmall" fill="#ffffff">POSTGRESQL</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall" fill="#ffffff">JDBC JOIN</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Taxi Zone</text>
  </g>
  <g transform="translate(655,247)">
    <circle cx="50" cy="56" r="47" class="soft" stroke="#111" stroke-width="2"/>
    <text x="50" y="50" text-anchor="middle" class="stage ink">H2O</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall ink">5 MÔ HÌNH</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Train + evaluate</text>
  </g>
  <g transform="translate(850,247)">
    <circle cx="50" cy="56" r="47" class="ink"/>
    <text x="50" y="51" text-anchor="middle" class="stage" fill="#ffffff">MOJO</text>
    <text x="50" y="71" text-anchor="middle" class="stageSmall" fill="#ffffff">EXPORT</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Portable model</text>
  </g>
  <g transform="translate(1045,247)">
    <circle cx="50" cy="56" r="47" class="soft" stroke="#111" stroke-width="2"/>
    <text x="50" y="50" text-anchor="middle" class="stage ink">BATCH</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall ink">STREAMING</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">8,15M + micro-batch</text>
  </g>
  <g transform="translate(1240,247)">
    <circle cx="50" cy="56" r="47" class="ink"/>
    <text x="50" y="50" text-anchor="middle" class="stage" fill="#ffffff">DOCKER</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall" fill="#ffffff">IMAGE</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Container scoring</text>
  </g>
  <g transform="translate(1435,247)">
    <circle cx="50" cy="56" r="47" class="soft" stroke="#111" stroke-width="2"/>
    <text x="50" y="50" text-anchor="middle" class="stage ink">K8S</text>
    <text x="50" y="70" text-anchor="middle" class="stageSmall ink">JOB</text>
    <text x="50" y="122" text-anchor="middle" class="stageSmall ink">Complete 1/1</text>
  </g>

  <!-- Panels -->
  <g transform="translate(70,408)">
    <rect width="345" height="313" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect width="345" height="57" rx="12" class="ink"/>
    <rect y="43" width="345" height="14" class="ink"/>
    <text x="24" y="37" class="panelTitle" fill="#ffffff">CẤU HÌNH</text>
    <text x="24" y="91" class="label muted">Môi trường đã kiểm chứng</text>
    <line x1="24" y1="108" x2="321" y2="108" class="hairline"/>
    <text x="24" y="143" class="bodyStrong ink">Python</text><text x="321" y="143" text-anchor="end" class="body ink">3.11</text>
    <text x="24" y="177" class="bodyStrong ink">Java</text><text x="321" y="177" text-anchor="end" class="body ink">17</text>
    <text x="24" y="211" class="bodyStrong ink">Apache Spark</text><text x="321" y="211" text-anchor="end" class="body ink">3.5.0</text>
    <text x="24" y="245" class="bodyStrong ink">H2O</text><text x="321" y="245" text-anchor="end" class="body ink">3.46.0.6</text>
    <text x="24" y="279" class="bodyStrong ink">Nền tảng</text><text x="321" y="279" text-anchor="end" class="body ink">Windows local</text>
  </g>

  <g transform="translate(442,408)">
    <rect width="345" height="313" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect width="345" height="57" rx="12" class="ink"/>
    <rect y="43" width="345" height="14" class="ink"/>
    <text x="24" y="37" class="panelTitle" fill="#ffffff">DỮ LIỆU</text>
    <text x="24" y="91" class="label muted">Yellow Taxi • 12 tháng năm 2025</text>
    <line x1="24" y1="108" x2="321" y2="108" class="hairline"/>
    <text x="24" y="146" class="value ink">48.722.602</text><text x="24" y="169" class="body muted">dòng dữ liệu raw</text>
    <text x="180" y="146" class="value ink">46.714.819</text><text x="180" y="169" class="body muted">dòng sau làm sạch</text>
    <line x1="24" y1="191" x2="321" y2="191" class="hairline"/>
    <text x="24" y="225" class="bodyStrong ink">Train</text><text x="321" y="225" text-anchor="end" class="body ink">34.327.814</text>
    <text x="24" y="259" class="bodyStrong ink">Validation</text><text x="321" y="259" text-anchor="end" class="body ink">4.231.702</text>
    <text x="24" y="293" class="bodyStrong ink">Test</text><text x="321" y="293" text-anchor="end" class="body ink">8.155.303</text>
  </g>

  <g transform="translate(814,408)">
    <rect width="345" height="313" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect width="345" height="57" rx="12" class="ink"/>
    <rect y="43" width="345" height="14" class="ink"/>
    <text x="24" y="37" class="panelTitle" fill="#ffffff">MÔ HÌNH &amp; KẾT QUẢ</text>
    <text x="24" y="91" class="label muted">So sánh khách quan 5 phương pháp</text>
    <line x1="24" y1="108" x2="321" y2="108" class="hairline"/>
    <text x="24" y="140" class="body ink">GBM • DRF • Deep Learning</text>
    <text x="24" y="170" class="body ink">GBM Grid Search • AutoML</text>
    <rect x="24" y="193" width="297" height="92" rx="10" class="soft"/>
    <text x="42" y="225" class="eyebrow ink">MÔ HÌNH TỐT NHẤT: DRF</text>
    <text x="42" y="255" class="bodyStrong ink">RMSE 7,4383 • MAE 4,5895</text>
    <text x="42" y="279" class="bodyStrong ink">R² 0,7488</text>
  </g>

  <g transform="translate(1186,408)">
    <rect width="344" height="313" rx="14" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect width="344" height="57" rx="12" class="ink"/>
    <rect y="43" width="344" height="14" class="ink"/>
    <text x="24" y="37" class="panelTitle" fill="#ffffff">DEMO &amp; CÔNG CỤ</text>
    <text x="24" y="91" class="label muted">Ba kênh demo chính</text>
    <line x1="24" y1="108" x2="320" y2="108" class="hairline"/>
    <rect x="24" y="129" width="88" height="31" rx="15" class="ink"/><text x="68" y="150" text-anchor="middle" class="chip" fill="#fff">TERMINAL</text>
    <rect x="120" y="129" width="92" height="31" rx="15" class="soft"/><text x="166" y="150" text-anchor="middle" class="chip ink">H2O FLOW</text>
    <rect x="220" y="129" width="100" height="31" rx="15" class="ink"/><text x="270" y="150" text-anchor="middle" class="chip" fill="#fff">DASHBOARD</text>
    <text x="24" y="197" class="bodyStrong ink">Phân tích</text><text x="320" y="197" text-anchor="end" class="body ink">Spark + PostgreSQL</text>
    <text x="24" y="229" class="bodyStrong ink">Mô hình</text><text x="320" y="229" text-anchor="end" class="body ink">H2O + MOJO</text>
    <text x="24" y="261" class="bodyStrong ink">Luồng mới</text><text x="320" y="261" text-anchor="end" class="body ink">Structured Streaming</text>
    <text x="24" y="293" class="bodyStrong ink">Triển khai</text><text x="320" y="293" text-anchor="end" class="body ink">Docker + Kubernetes</text>
  </g>

  <!-- Verified results -->
  <rect x="70" y="747" width="1460" height="91" rx="14" class="ink"/>
  <text x="98" y="779" class="eyebrow" fill="#bdbdbd">RUNTIME ĐÃ KIỂM CHỨNG • 15/10/2026</text>
  <text x="98" y="813" class="result" fill="#ffffff">8.155.303 dự đoán</text>
  <line x1="326" y1="767" x2="326" y2="819" stroke="#555" stroke-width="1"/>
  <text x="356" y="798" class="result" fill="#ffffff">0 prediction null</text>
  <line x1="570" y1="767" x2="570" y2="819" stroke="#555" stroke-width="1"/>
  <text x="600" y="790" class="result" fill="#ffffff">28.416 dòng/giây</text>
  <text x="600" y="814" class="resultSmall" fill="#bdbdbd">Kubernetes scoring</text>
  <line x1="827" y1="767" x2="827" y2="819" stroke="#555" stroke-width="1"/>
  <text x="857" y="790" class="result" fill="#ffffff">Job Complete 1/1</text>
  <text x="857" y="814" class="resultSmall" fill="#bdbdbd">5 phút 30 giây • 0 restart</text>
  <line x1="1105" y1="767" x2="1105" y2="819" stroke="#555" stroke-width="1"/>
  <text x="1135" y="790" class="result" fill="#ffffff">Docker SUCCESS</text>
  <text x="1135" y="814" class="resultSmall" fill="#bdbdbd">Kubernetes SUCCESS</text>

  <!-- Minimal skyline -->
  <g fill="#d9d9d9">
    <rect x="0" y="866" width="52" height="34"/><rect x="59" y="850" width="45" height="50"/>
    <rect x="111" y="875" width="66" height="25"/><rect x="184" y="858" width="38" height="42"/>
    <rect x="229" y="842" width="54" height="58"/><rect x="290" y="870" width="76" height="30"/>
    <rect x="373" y="850" width="49" height="50"/><rect x="429" y="863" width="61" height="37"/>
    <rect x="497" y="831" width="43" height="69"/><rect x="547" y="858" width="71" height="42"/>
    <rect x="625" y="872" width="55" height="28"/><rect x="687" y="845" width="42" height="55"/>
    <rect x="736" y="856" width="65" height="44"/><rect x="808" y="836" width="51" height="64"/>
    <rect x="866" y="869" width="72" height="31"/><rect x="945" y="847" width="46" height="53"/>
    <rect x="998" y="859" width="68" height="41"/><rect x="1073" y="827" width="39" height="73"/>
    <rect x="1119" y="852" width="70" height="48"/><rect x="1196" y="871" width="57" height="29"/>
    <rect x="1260" y="841" width="50" height="59"/><rect x="1317" y="862" width="68" height="38"/>
    <rect x="1392" y="848" width="44" height="52"/><rect x="1443" y="872" width="69" height="28"/>
    <rect x="1519" y="854" width="81" height="46"/>
  </g>
</svg>
