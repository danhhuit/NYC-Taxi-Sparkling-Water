# ==========================================================
# NYC TAXI - APACHE SPARK CONFIGURATION
# ==========================================================

# Local execution
spark.master                     local[*]

# Memory
spark.driver.memory              2g
spark.executor.memory            2g

# SQL / Shuffle
spark.sql.shuffle.partitions     8

# Spark Web UI
spark.ui.enabled                 true
spark.ui.port                    4040

# Application settings
spark.sql.session.timeZone       America/New_York